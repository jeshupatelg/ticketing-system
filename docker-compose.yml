  #     - postgres_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ticketing_db}"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 5
  #   networks:
  #     - gateway_net

  # ==========================================
  # Ticketing System Web Application
  # ==========================================
  ticketing-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ticketing-system:latest
    container_name: ticketing-app
    restart: unless-stopped
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    environment:
      PORT: ${PORT:-8080}
      CONTEXT_PATH: ${CONTEXT_PATH:-}

      # PostgreSQL Database Connection (remote PostgreSQL instance on gateway_net)
      DB_HOST: ${DB_HOST:-homeserver-pg}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-ticketing_db}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://${DB_HOST:-homeserver-pg}:${DB_PORT:-5432}/${DB_NAME:-ticketing_db}}
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}

      # Keycloak JWT relayed by APIGW
      JWT_HEADER: ${JWT_HEADER:-Authorization}
      JWT_PREFIX: ${JWT_PREFIX:-Bearer }

      # Attachment & Avatar Configurable Limits
      MAX_ATTACHMENT_COUNT: ${MAX_ATTACHMENT_COUNT:-10}
      MAX_ATTACHMENT_SIZE_MB: ${MAX_ATTACHMENT_SIZE_MB:-20}
      MAX_AVATAR_SIZE_MB: ${MAX_AVATAR_SIZE_MB:-2}
      ATTACHMENT_STORAGE_DIR: /app/data/attachments
      AVATAR_STORAGE_DIR: /app/data/avatars
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${HOST_PORT:-8086}:${PORT:-8080}"
    volumes:
      - app_attachments:/app/data/attachments
      - app_avatars:/app/data/avatars
    networks:
      - gateway_net

networks:
  gateway_net:
    name: gateway_net
    external: true

volumes:
  # postgres_data:
  #   driver: local
  app_attachments:
    driver: local
  app_avatars:
    driver: local

  #     POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
  #   ports:
  #     # Exposes port 5433 on the host to avoid collisions with local services on 5432
  #     - "${HOST_DB_PORT:-5433}:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ticketing_db}"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 5
  #   networks:
  #     - gateway_net

  # ==========================================
  # Ticketing System Web Application
  # ==========================================
  ticketing-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-customized-eclipse-temurin:21-jdk}
    image: ticketing-system:latest
    container_name: ticketing-app
    restart: unless-stopped
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    environment:
      # Centralized Config Manager Integration (customized base image)
      CONFIG_IMPORT_ENABLED: ${CONFIG_IMPORT_ENABLED:-true}
      CONFIG_EXPORT_ENABLED: ${CONFIG_EXPORT_ENABLED:-false}
      CONFIG_MANAGER_URL: ${CONFIG_MANAGER_URL:-https://config-manager:8443}
      APPLICATION_NAME: ${APPLICATION_NAME:-ticketing-app}
      CONFIG_PARAMS: ${CONFIG_PARAMS:-pg}

      PORT: ${PORT:-8080}
      CONTEXT_PATH: ${CONTEXT_PATH:-}
    extra_hosts:

      - "host.docker.internal:host-gateway"
    ports:
      - "${HOST_PORT:-8086}:${PORT:-8080}"
    volumes:
      - ${CONFIG_CERTS_PATH:-/config}/ticketing-app:/certs:ro
      - app_attachments:/app/data/attachments
      - app_avatars:/app/data/avatars
    networks:
      - gateway_net

networks:
  gateway_net:
    name: gateway_net
    external: true

volumes:
  # postgres_data:
  #   driver: local
  app_attachments:
    driver: local
  app_avatars:
    driver: local

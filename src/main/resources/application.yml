server:
  port: ${PORT:8080}
  servlet:
    context-path: ${CONTEXT_PATH:}

spring:
  application:
    name: ticketing-system
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ticketing_db}}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  servlet:
    multipart:
      max-file-size: ${MAX_ATTACHMENT_SIZE_MB:20}MB
      max-request-size: ${MAX_ATTACHMENT_SIZE_MB:20}MB

app:
  jwt:
    header-name: ${JWT_HEADER:Authorization}
    token-prefix: ${JWT_PREFIX:Bearer }
  attachments:
    max-count: ${MAX_ATTACHMENT_COUNT:10}
    max-size-mb: ${MAX_ATTACHMENT_SIZE_MB:20}
    storage-dir: ${ATTACHMENT_STORAGE_DIR:./data/attachments}
  avatars:
    max-size-mb: ${MAX_AVATAR_SIZE_MB:2}
    storage-dir: ${AVATAR_STORAGE_DIR:./data/avatars}
  photos:
    max-size-mb: ${MAX_PHOTO_SIZE_MB:${MAX_AVATAR_SIZE_MB:2}}
